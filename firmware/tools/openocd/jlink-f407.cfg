# -----------------------------------------------------------------------------
#  STM32F407 + SEGGER J-Link over SWD
#
#  Usage (OpenOCD needs its own script dir first, then this file):
#      openocd -s <openocd>/share/openocd/scripts \
#              -f tools/openocd/jlink-f407.cfg \
#              -c "adapter speed 4000" \
#              -c "program {build/project.elf} verify reset exit"
#
#  Or just use the VS Code tasks / tools/flash.cmd.
# -----------------------------------------------------------------------------

# The probe. Resolved against OpenOCD's script directory, which is why -s has
# to point there.
source [find interface/jlink.cfg]

# SWD: two wires, and it leaves the JTAG pins free. Must come after the driver
# is selected.
transport select swd

# --- GDB server ---------------------------------------------------------------
# While the core is halted 0x08000000 is not readable; without this GDB reads
# the memory map on connect and can appear to hang.
gdb memory_map disable

# Let GDB do the flash programming using the ELF's section addresses.
gdb flash_program enable

# OpenOCD 0.12 removed gdb_init_break, so attaching does not halt the core.
# Halt explicitly from the debugger, or use the "openocd-load" style task.

# --- Target -------------------------------------------------------------------
# Flash algorithm and reset behaviour for the STM32F4 family.
source [find target/stm32f4x.cfg]
